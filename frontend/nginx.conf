map $http_x_forwarded_proto $vueio_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# The public port is loopback-only by default. When an operator explicitly
# enables a generic host reverse proxy, preserve only the first address that
# proxy supplied. Otherwise discard caller-supplied forwarding headers.
map "${VUEIO_TRUST_UPSTREAM_PROXY}:$http_x_forwarded_for" $vueio_forwarded_client {
    default $remote_addr;
    ~^true:\s*(?<trusted_client>[^,\s]+) $trusted_client;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    # Keep JSON and form endpoints small by default. Only the bounded upload
    # routes below receive larger request bodies.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:" always;

    # Uvicorn listens on IPv4; resolve dynamically so engine recreation cannot leave a stale upstream.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    set $vueio_engine_url http://vueio_engine:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Upload-session manifests may describe thousands of files but never carry
    # media bytes themselves.
    location ~ ^/api/(?:projects/[^/]+|share/[^/]+)/uploads$ {
        client_max_body_size 16m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    # Resumable uploads are application-bounded to 8 MiB per raw chunk.
    location ~ ^/api/(?:projects/[^/]+|share/[^/]+)/uploads/[^/]+/items/[^/]+$ {
        client_max_body_size 8m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    # Custom media and shot-version thumbnails are bounded to 20 MiB by the
    # engine; allow only enough multipart overhead to reach that limit.
    location ~ ^/api/horizons/projects/[^/]+/(?:media-assets/[^/]+|shot-versions/[^/]+)/thumbnail$ {
        client_max_body_size 21m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    location ~ ^/api/(?:folder-thumbnail/upload|horizons/projects/[^/]+/thumbnail/upload)$ {
        client_max_body_size 21m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    location ~ ^/api/(?:admin/identity/logo|projects/[^/]+/trackers/[^/]+/delivery-logo)$ {
        client_max_body_size 3m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    # JSON annotations may use the full 2 MiB application allowance plus JSON
    # envelope overhead. Keep this exception exact rather than widening /api.
    location = /api/comments {
        client_max_body_size 3m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    # Multipart endpoints retain the previous ceiling. Application-level file
    # and aggregate limits remain stricter than this transport allowance.
    location ~ ^/api/(?:comments/with-attachments|projects/[^/]+/(?:import|trackers/[^/]+/shots/[^/]+/brief/upload))$ {
        client_max_body_size 512m;
        include /etc/nginx/vueio-api-proxy.inc;
    }

    location /api {
        include /etc/nginx/vueio-api-proxy.inc;
    }

    # Share URLs need crawler-visible Open Graph tags before the SPA boots.
    location ~ ^/(s|p)/[A-Za-z0-9_-]+ {
        include /etc/nginx/vueio-api-proxy.inc;
    }

    # SPA routing - serve index.html for all non-file routes
    # This includes: /files, /projects, settings, auth redirects, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
