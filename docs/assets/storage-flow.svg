 <text x="72" y="186" font-size="28" font-weight="700" fill="#e7f0e9">Your storage</text>
 <text x="72" y="222" font-size="18" fill="#a6b9ac">Local disk · external drive</text>
 <text x="72" y="249" font-size="18" fill="#a6b9ac">or mounted network storage</text>
 <text x="537" y="186" font-size="28" font-weight="700" fill="#effcf1">Your Vue.io host</text>
 <text x="537" y="222" font-size="18" fill="#b7d1be">Review · track · deliver</text>
 <text x="537" y="249" font-size="18" fill="#b7d1be">Runs on your infrastructure</text>
 <text x="1039" y="186" font-size="28" font-weight="700" fill="#e7f0e9">Their browser</text>
 <text x="1039" y="222" font-size="18" fill="#a6b9ac">Your team and clients</text>
 <text x="1039" y="249" font-size="18" fill="#a6b9ac">No server install to review</text>
 <text x="700" y="332" text-anchor="middle" font-size="16" fill="#a6b9ac">Remote access needs your configured HTTPS connection. Keep the host and storage online.</text>
