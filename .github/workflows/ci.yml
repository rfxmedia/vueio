name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock
      - run: python -m compileall -q app main.py alembic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete public history for committed credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          scanner=ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          if [[ -f ops/deploy-nas.sh ]]; then
            echo "Private engineering tree detected; scanning the current tree."
            mode=dir
          else
            echo "Public source tree detected; scanning its complete sanitized history."
            mode=git
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$scanner" \
            "$mode" /repo --redact --no-banner
      - name: Validate release scripts and Compose model
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/vueioctl
          sh -n install.sh
          python3 -m py_compile ops/vueio-updater.py
          cp .env.release.example "$RUNNER_TEMP/vueio-release.env"
          cat >"$RUNNER_TEMP/vueio-release.storage.yml" <<'YAML'
          services:
            vueio_engine:
              volumes: []
          YAML
          docker compose \
            --env-file "$RUNNER_TEMP/vueio-release.env" \
            -f compose.release.yml \
            -f "$RUNNER_TEMP/vueio-release.storage.yml" \
            config -q
      - name: Build public release images
        run: |
          docker build --pull -t vueio-engine-release-ci:local ./backend
          docker build --pull -t vueio-ui-release-ci:local ./frontend
          docker run --rm vueio-engine-release-ci:local sh -c \
            'test -s /app/moonshine-models/MOONSHINE_LICENSE.txt && find /usr/share/doc -name copyright -type f -print -quit | grep -q .'
          docker run --rm --entrypoint sh vueio-ui-release-ci:local -c \
            'test -s /usr/share/nginx/html/THIRD_PARTY_NOTICES.txt && find /usr/share/licenses -type f -print -quit | grep -q .'
      - name: Report all high and critical release-image findings
        shell: bash
        run: |
          set -Eeuo pipefail
          scanner='aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c'
          for image in vueio-engine-release-ci:local vueio-ui-release-ci:local; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v vueio-trivy-cache:/root/.cache/ \
              "$scanner" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              "$image"
          done
      - name: Reject fixable high and critical release-image vulnerabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          scanner='aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c'
          for image in vueio-engine-release-ci:local vueio-ui-release-ci:local; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v vueio-trivy-cache:/root/.cache/ \
              "$scanner" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$image"
          done
